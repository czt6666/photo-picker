<meta charset="utf-8">
<title>全库精选</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;600;800&display=swap">
<style>
/* 布局：一行统计 + 模型切换 + 轮播按钮，下面是选中照片的样片墙；点任意一张看大图，「轮播」全屏自动播 */
:root {
  --bg: #f3f2ef; --panel: #ffffff; --fg: #1d1c1a; --muted: #6d6a63; --line: #dcd9d2;
  --accent: #c2410c;
  --sans: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161514; --panel: #201f1d; --fg: #ece9e3; --muted: #9c978d; --line: #34322e; --accent: #f08a4b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161514; --panel: #201f1d; --fg: #ece9e3; --muted: #9c978d; --line: #34322e; --accent: #f08a4b; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 60px; }
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-size: 1.7rem; font-weight: 800; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 68ch; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .8rem; letter-spacing: .04em; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bar .play { margin-left: auto; background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: grid; cursor: zoom-in; }
figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--line); }
figcaption { padding: 6px 9px 8px; font-size: .76rem; display: grid; gap: 1px; min-width: 0; }
.row { display: flex; justify-content: space-between; gap: 8px; }
.score { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.album { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.agree { color: var(--accent); }
.row.why2 { display: block; }
.agree.no { color: var(--muted); }
.kind { white-space: nowrap; color: var(--muted); }
.kind.p { color: var(--accent); }
h2 { font-size: 1.1rem; font-weight: 600; margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
h2 small { font-weight: 400; color: var(--muted); font-size: .85rem; }
section { display: grid; gap: 12px; }
.sub { display: flex; gap: 6px; flex-wrap: wrap; }
.sub button { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.sub button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
[hidden] { display: none !important; }
</style>

<main>
  <header>
    <h1 id="title">全库精选</h1>
    <p class="lead" id="lead"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar" role="group" aria-label="美学模型"></div>
  <div class="sub" id="mode" role="group" aria-label="范围">
    <button type="button" id="mode-all" data-m="all">全部照片</button>
    <button type="button" id="mode-wall" data-m="wall">壁纸：不含人</button>
    <button type="button" id="mode-top" data-m="top">对照：纯按分数</button>
  </div>
  <p class="lead" id="modelead"></p>
  <div class="grid" id="grid"></div>
  <section>
    <h2>人像识别抽查 <small id="kinds"></small></h2>
    <p class="lead">「人像」是人为主体的照片，「有人」是画面里有人但不是主体（路人、航拍里的小人）。壁纸只用「无人」，宁可错杀。每类随机抽一些，「无人」里最像有人的排在最前，最可能漏判的先看。</p>
    <div class="sub" id="kindbar" role="group" aria-label="人像类别"></div>
    <div class="grid small" id="kgrid"></div>
  </section>
</main>
<script src="big/index.js"></script>
<script>
/*BIGVIEW*/
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const KEYS = Object.keys(DATA.runs);
let cur = DATA.runs.v25 ? "v25" : KEYS[0], mode = "all", kind = "人像";
try { const s = localStorage.getItem("library-model2"); if (s && DATA.runs[s]) cur = s; } catch (e) {}
const list = () => DATA.runs[cur][mode] || [];
const base = (q) => q.name.split("/").pop();

// 纯按分数的前几名里，没进精选的大概是因为什么。精确原因要看去重时的相似度，网页里没有，这里按时间和相册推断
function whyNot(i) {
  const picked = DATA.runs[cur].all;
  if (picked.includes(i)) return ["已入选", true];
  const p = DATA.photos[i], P = picked.map((j) => DATA.photos[j]).filter((q) => q.album === p.album);
  const same = P.find((q) => base(q) === base(p));
  if (same) return ["同一张的另一版本已入选（" + same.name.split("/").slice(1, -1).join("/") + "）", false];
  const burst = p.time != null && P.find((q) => q.time != null && Math.abs(q.time - p.time) <= 90);
  if (burst) return ["和入选的 " + base(burst) + " 只差 " + Math.round(Math.abs(burst.time - p.time)) + " 秒，多半是连拍", false];
  if (P.length >= DATA.cap) return ["这个相册已选满 " + DATA.cap + " 张", false];
  return ["画质没过，或和已选的太像", false];
}

function card(i, onclick, big) {
  const p = DATA.photos[i];
  const f = document.createElement("figure");
  const img = document.createElement("img");
  img.src = p.src; img.alt = p.name; img.loading = "lazy";
  f.appendChild(img);
  const c = document.createElement("figcaption");
  const row = document.createElement("div"); row.className = "row";
  const sc = document.createElement("span"); sc.className = "score";
  sc.textContent = big ? DATA.names[cur] + " " + (p.aes[cur] ?? "–") : p.why;
  row.appendChild(sc);
  if (big) {
    const a = document.createElement("span"); a.className = "agree";
    if (mode === "top") {
      const [t, inn] = whyNot(i);
      a.textContent = t; a.title = t; if (!inn) a.classList.add("no");
    } else {
      const agree = KEYS.filter((k) => DATA.runs[k][mode].includes(i));
      if (agree.length > 1) a.textContent = agree.length === KEYS.length ? "全部模型都选" : agree.length + " 个模型都选";
    }
    if (mode === "top") { const r2 = document.createElement("div"); r2.className = "row why2"; r2.appendChild(a); c.append(row, r2); }
    else row.appendChild(a);
  }
  if (!row.parentNode) c.appendChild(row);
  const meta = document.createElement("div"); meta.className = "row";
  const al = document.createElement("span"); al.className = "album"; al.textContent = p.name; al.title = p.name;
  const kd = document.createElement("span"); kd.className = "kind" + (p.kind === "人像" ? " p" : ""); kd.textContent = p.kind;
  meta.append(al, kd);
  c.appendChild(meta);
  f.appendChild(c);
  if (onclick) f.onclick = onclick;
  return f;
}

function render() {
  const r = DATA.runs[cur];
  document.querySelectorAll("#bar button[data-k]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === cur));
  document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === mode));
  const L = list();
  const shared = mode === "top" ? L.filter((i) => r.all.includes(i)).length
    : L.filter((i) => KEYS.every((k) => (DATA.runs[k][mode] || []).includes(i))).length;
  $("stats").innerHTML = [
    [DATA.n, "张照片"], [DATA.albums, "个相册"], [r.groups, "去重后剩几组"], [L.length, mode === "top" ? "分数最高的" : "选中"],
    [shared, mode === "top" ? "其中进了精选" : "全部模型都选了"], [r.ms != null ? r.ms + " ms" : "–", "每张打分耗时"],
  ].map(([v, l]) => '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>').join("");
  const g = $("grid"); g.replaceChildren();
  L.forEach((i, pos) => g.appendChild(card(i, () => view(L, pos), true)));
  $("modelead").textContent = {
    all: "排列顺序就是挑选顺序。第一张是全库分最高的；之后每一步都在「分高」和「跟已选的不像」之间取舍，所以越往后越不是按分数排。",
    wall: "同样的挑法，只是候选里去掉了检测到人的照片。",
    top: "不去连拍、不限相册、不管像不像，直接取这个模型分数最高的 " + L.length + " 张，按分数从高到低。右上角写着它有没有进精选，没进的大概是什么原因。",
  }[mode];
}
const items = (L) => L.map((i) => ({ i, rel: DATA.photos[i].name, src: DATA.photos[i].src }));
const capOf = (it) => {
  const p = DATA.photos[it.i];
  return p.name + "　" + p.kind + "　" + KEYS.map((k) => DATA.names[k] + " " + (p.aes[k] ?? "–")).join("　");
};
function view(L, pos) { BigView.open(items(L), pos, { cap: capOf }); }
function renderKinds() {
  document.querySelectorAll("#kindbar button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === kind));
  const g = $("kgrid"); g.replaceChildren();
  DATA.sample[kind].forEach((i, pos) => g.appendChild(card(i, () => view(DATA.sample[kind], pos), false)));
}

$("title").textContent = "全库精选 · " + DATA.root;
$("lead").textContent = "从 " + DATA.albums + " 个相册的 " + DATA.n + " 张照片里，每个模型各挑 " + DATA.k + " 张。连拍和几乎一样的只留一张，每个相册最多 " + DATA.cap + " 张。「壁纸」那组只用一个人都没检测到的照片。照片原地没动。各模型的分数刻度不同，只在同一个模型里比高低。点照片看大图。";
$("kinds").textContent = Object.entries(DATA.kinds).map(([k, v]) => k + " " + v + " 张").join(" · ");
KEYS.forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.k = k; b.id = "tab-" + k; b.textContent = DATA.names[k] || k;
  b.onclick = () => { cur = k; try { localStorage.setItem("library-model2", k); } catch (e) {} render(); };
  $("bar").appendChild(b);
});
const pb = document.createElement("button");
pb.type = "button"; pb.className = "play"; pb.id = "play"; pb.textContent = "▶ 轮播"; pb.onclick = () => BigView.open(items(list()), 0, { cap: capOf, play: true });
$("bar").appendChild(pb);
document.querySelectorAll("#mode button").forEach((b) => (b.onclick = () => { mode = b.dataset.m; render(); }));
["人像", "有人", "无人"].forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.k = k; b.id = "kind-" + k; b.textContent = k + "（" + (DATA.kinds[k] || 0) + "）";
  b.onclick = () => { kind = k; renderKinds(); };
  $("kindbar").appendChild(b);
});
render(); renderKinds();
</script>
