<title>全库精选</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+SC:wght@400;600;800&display=swap">
<style>
/* 布局：一行统计 + 模型切换 + 轮播按钮，下面是选中照片的样片墙；点任意一张或「轮播」进全屏 */
:root {
  --bg: #f3f2ef; --panel: #ffffff; --fg: #1d1c1a; --muted: #6d6a63; --line: #dcd9d2;
  --accent: #c2410c; --shade: rgba(12, 11, 10, 0.94);
  --sans: "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161514; --panel: #201f1d; --fg: #ece9e3; --muted: #9c978d; --line: #34322e; --accent: #f08a4b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161514; --panel: #201f1d; --fg: #ece9e3; --muted: #9c978d; --line: #34322e; --accent: #f08a4b; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 60px; }
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-size: 1.7rem; font-weight: 800; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; max-width: 68ch; }
.stats { display: flex; flex-wrap: wrap; gap: 28px; }
.stat b { display: block; font-family: var(--mono); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .8rem; letter-spacing: .04em; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar button { font: inherit; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
.bar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.bar .play { margin-left: auto; background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; display: grid; cursor: zoom-in; }
figure img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--line); }
figcaption { padding: 6px 9px 8px; font-size: .76rem; display: grid; gap: 1px; min-width: 0; }
.row { display: flex; justify-content: space-between; gap: 8px; }
.score { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.album { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.agree { color: var(--accent); white-space: nowrap; }
#show { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: grid; grid-template-rows: 1fr auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
#show img { width: 100%; height: 100%; object-fit: contain; min-height: 0; transition: opacity .5s; }
#show .cap { color: #e9e5dd; text-align: center; padding: 10px 16px 14px; font-size: .85rem; }
#show .cap span { color: #a39d92; }
#show .x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  background: none; border: 0; color: #e9e5dd; font-size: 1.6rem; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { #show img { transition: none; } }
</style>

<main>
  <header>
    <h1 id="title">全库精选</h1>
    <p class="lead" id="lead"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar" role="group" aria-label="美学模型"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="show" hidden>
  <img id="show-img" alt="">
  <div class="cap" id="show-cap"></div>
  <button class="x" id="show-x" type="button" aria-label="关闭轮播">×</button>
</div>

<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
let cur = DATA.runs.v25 ? "v25" : Object.keys(DATA.runs)[0];
try { const s = localStorage.getItem("library-model"); if (s && DATA.runs[s]) cur = s; } catch (e) {}

function render() {
  const r = DATA.runs[cur];
  document.querySelectorAll("#bar button[data-k]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === cur));
  const allThree = r.chosen.filter((i) => DATA.photos[i].in.length === Object.keys(DATA.runs).length).length;
  $("stats").innerHTML = [
    [DATA.n, "张照片"], [DATA.albums, "个相册"], [r.groups, "去重后剩几组"], [r.chosen.length, "选中"],
    [allThree, "三个模型都选了"], [r.ms != null ? r.ms + " ms" : "–", "每张打分耗时"],
  ].map(([v, l]) => '<div class="stat"><b>' + v + '</b><span>' + l + '</span></div>').join("");
  const g = $("grid"); g.replaceChildren();
  r.chosen.forEach((i, pos) => {
    const p = DATA.photos[i];
    const f = document.createElement("figure");
    const img = document.createElement("img");
    img.src = p.src; img.alt = p.name; img.loading = "lazy";
    f.appendChild(img);
    const c = document.createElement("figcaption");
    const row = document.createElement("div"); row.className = "row";
    const sc = document.createElement("span"); sc.className = "score"; sc.textContent = "美学 " + p.aes[cur];
    row.appendChild(sc);
    if (p.in.length > 1) {
      const a = document.createElement("span"); a.className = "agree";
      a.textContent = p.in.length === Object.keys(DATA.runs).length ? "三个都选" : p.in.map((k) => DATA.names[k].replace(/^.*?(B\/32|L\/14|V2\.5).*$/, "$1")).join("+") + " 都选";
      row.appendChild(a);
    }
    c.appendChild(row);
    const al = document.createElement("span"); al.className = "album"; al.textContent = p.name; al.title = p.name;
    c.appendChild(al);
    f.appendChild(c);
    f.onclick = () => play(pos);
    g.appendChild(f);
  });
}

let timer = null, at = 0;
function showAt(pos) {
  const list = DATA.runs[cur].chosen;
  at = (pos + list.length) % list.length;
  const p = DATA.photos[list[at]];
  $("show-img").src = p.src; $("show-img").alt = p.name;
  $("show-cap").innerHTML = "";
  $("show-cap").append(p.album + "　", Object.assign(document.createElement("span"), { textContent: (at + 1) + " / " + list.length + "　←→ 切换，空格暂停" }));
}
function play(pos) {
  $("show").hidden = false; showAt(pos || 0);
  clearInterval(timer); timer = setInterval(() => showAt(at + 1), 4000);
  try { $("show").requestFullscreen && $("show").requestFullscreen().catch(() => {}); } catch (e) {}
}
function stop() {
  $("show").hidden = true; clearInterval(timer); timer = null;
  try { document.fullscreenElement && document.exitFullscreen().catch(() => {}); } catch (e) {}
}
$("show-x").onclick = stop;
$("show-img").onclick = () => showAt(at + 1);
document.addEventListener("keydown", (e) => {
  if ($("show").hidden) return;
  if (e.key === "Escape") stop();
  else if (e.key === "ArrowRight") showAt(at + 1);
  else if (e.key === "ArrowLeft") showAt(at - 1);
  else if (e.key === " ") { e.preventDefault(); if (timer) { clearInterval(timer); timer = null; } else timer = setInterval(() => showAt(at + 1), 4000); }
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && !$("show").hidden && timer === null) {} });

$("title").textContent = "全库精选 · " + DATA.root;
$("lead").textContent = "从 " + DATA.albums + " 个相册的 " + DATA.n + " 张照片里，三个模型各挑 " + DATA.k + " 张。连拍和几乎一样的只留一张，每个相册最多 " + DATA.cap + " 张，让不同的旅行都能轮到。照片原地没动。美学分各模型刻度不同，只在同一个模型里比高低。";
Object.keys(DATA.runs).forEach((k) => {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.k = k; b.id = "tab-" + k; b.textContent = DATA.names[k] || k;
  b.onclick = () => { cur = k; try { localStorage.setItem("library-model", k); } catch (e) {} render(); };
  $("bar").appendChild(b);
});
const pb = document.createElement("button");
pb.type = "button"; pb.className = "play"; pb.id = "play"; pb.textContent = "▶ 轮播"; pb.onclick = () => play(0);
$("bar").appendChild(pb);
render();
</script>
