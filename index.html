<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选片</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="tb-side">
          <button id="btn-workdir" class="btn workdir"></button>
          <button id="btn-rescan" class="btn icon" data-i18n-title="rescan.title">⟳</button>
        </div>
        <div class="view-title" id="view-title"></div>
        <input id="search" class="search" type="search" data-i18n-ph="search.ph" autocomplete="off" spellcheck="false" />
        <button id="btn-help" class="btn icon" data-i18n-title="help.btnTitle">?</button>
      </header>

      <div class="main">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sb-resizer" id="sb-resizer" data-i18n-title="resizer.title"></div>
        <section class="content">
          <div class="grid" id="grid" tabindex="0">
            <div class="grid-inner" id="grid-inner"></div>
          </div>
          <div class="empty" id="empty" hidden></div>
        </section>
      </div>

      <footer class="statusbar">
        <span id="status-count" class="status"></span>
        <button id="btn-star" class="btn" data-i18n="star.add" data-i18n-title="star.title"></button>
        <span id="status-thumbs" class="status dim"></span>
        <div class="spacer"></div>
        <label class="zoom" data-i18n-title="zoom.title">
          <span class="dim">▫</span>
          <input type="range" id="zoom" min="90" max="280" step="10" />
          <span class="dim big">◻</span>
        </label>
        <button id="btn-export" class="btn primary" data-i18n="export.btn"></button>
      </footer>

      <div id="viewer" class="viewer" hidden>
        <div class="v-top">
          <button class="btn v-back" data-i18n="v.back" data-i18n-title="v.backTitle"></button>
          <div class="v-title"><span class="v-name"></span><span class="v-pos dim"></span></div>
          <div class="v-actions">
            <button class="btn v-zoom" data-i18n-title="v.zoomTitle">1:1</button>
            <span class="v-rate" data-i18n-title="v.rateTitle"><button data-n="1">★</button><button data-n="2">★</button><button data-n="3">★</button><button data-n="4">★</button><button data-n="5">★</button></span>
            <button class="btn v-star" data-i18n="v.star" data-i18n-title="star.title"></button>
            <button class="btn v-full" data-i18n-title="v.fullTitle">⛶</button>
          </div>
        </div>
        <div class="v-stage">
          <img class="v-low" alt="" draggable="false" />
          <div class="v-starmark" hidden>★</div>
          <div class="v-error" hidden></div>
        </div>
        <div class="v-info dim"></div>
        <div class="v-strip"><div class="v-strip-inner"></div></div>
      </div>

      <div id="export-dialog" class="modal" hidden></div>
      <div id="toasts" class="toasts"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
