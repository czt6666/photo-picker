<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>选片</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <button id="btn-menu" class="btn icon tb-menu" title="相册">☰</button>
        <div class="tb-side">
          <button id="btn-workdir" class="btn workdir">📁 选择工作目录</button>
          <button id="btn-rescan" class="btn icon" title="重新扫描">⟳</button>
        </div>
        <button id="btn-share" class="btn share" title="把链接发给别人一起挑" hidden>🔗 <span class="label">分享</span></button>
        <div class="view-title" id="view-title"></div>
        <input id="search" class="search" type="search" placeholder="搜索文件名" autocomplete="off" spellcheck="false" />
        <button id="btn-settings" class="btn icon" title="设置">⚙</button>
        <button id="btn-help" class="btn icon" title="快捷键（?）">?</button>
      </header>

      <div class="main">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="drawer-mask" id="drawer-mask"></div>
        <div class="sb-resizer" id="sb-resizer" title="拖动调整宽度，双击还原"></div>
        <section class="content">
          <div class="grid" id="grid" tabindex="0">
            <div class="grid-inner" id="grid-inner"></div>
          </div>
          <div class="empty" id="empty" hidden></div>
        </section>
      </div>

      <footer class="statusbar">
        <span id="status-count" class="status"></span>
        <button id="btn-star" class="btn" title="星标（空格）">☆ 星标</button>
        <span id="status-thumbs" class="status dim"></span>
        <div class="spacer"></div>
        <label class="zoom" title="缩略图大小">
          <span class="dim">▫</span>
          <input type="range" id="zoom" min="90" max="280" step="10" />
          <span class="dim big">◻</span>
        </label>
        <button id="btn-export" class="btn primary">导出</button>
      </footer>

      <div id="viewer" class="viewer" hidden>
        <div class="v-top">
          <button class="btn v-back" title="返回（Esc）">← 图库</button>
          <div class="v-title"><span class="v-name"></span><span class="v-pos dim"></span></div>
          <div class="v-actions">
            <button class="btn v-zoom" title="1:1 / 适合窗口（Z 或双击）">1:1</button>
            <span class="v-rate" title="星级（1～5，0 清除）"><button data-n="1">★</button><button data-n="2">★</button><button data-n="3">★</button><button data-n="4">★</button><button data-n="5">★</button></span>
            <button class="btn v-star" title="星标（空格）">☆ 星标</button>
            <button class="btn v-full" title="全屏（F）">⛶</button>
          </div>
        </div>
        <div class="v-stage">
          <img class="v-low" alt="" draggable="false" />
          <div class="v-starmark" hidden>★</div>
          <div class="v-error" hidden></div>
        </div>
        <div class="v-peek"><img class="v-peek-img" alt="" draggable="false" /><img class="v-peek-img" alt="" draggable="false" /></div>
        <div class="v-info dim"></div>
        <div class="v-strip"><div class="v-strip-inner"></div></div>
        <div class="v-bar">
          <button class="v-bstar" title="星标">☆</button>
          <button class="v-binfo" title="信息">ⓘ</button>
        </div>
        <div class="v-sheet"><div class="v-grip"></div><div class="v-sheet-body"></div></div>
      </div>

      <div id="export-dialog" class="modal" hidden></div>
      <div id="toasts" class="toasts"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
