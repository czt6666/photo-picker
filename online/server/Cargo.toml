[package]
name = "photo-picker-online"
version = "0.1.0"
description = "PhotoPicker 在线选片：摄影师上传压缩预览，模特凭共享码在手机/平板/电脑上选片"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
