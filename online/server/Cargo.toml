[package]
name = "photo-picker-online"
version = "0.1.0"
description = "PhotoPicker 远程相册服务：存压缩预览、共用星标、实时推送"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "cors"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
parking_lot = "0.12"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
