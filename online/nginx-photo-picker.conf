# PhotoPicker 远程相册：网页和接口都在 /photo-picker/ 下。
# 放进 czt666.cn 那个 server { … } 里（https 的那个），服务端跑在本机 8081。
# 网页要用 PP_WEB_BASE=/photo-picker/ npm run build 构建。

location = /photo-picker {
    return 301 /photo-picker/;
}

location ^~ /photo-picker/ {
    # 去掉 /photo-picker 前缀再转给服务端（服务端自己不知道这个前缀）
    proxy_pass http://127.0.0.1:8081/;
    proxy_http_version 1.1;
    # 实时同步用 WebSocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    # 上传的预览图最大 10MB
    client_max_body_size 20m;
    # 写明编码，浏览器不用猜（服务端自己也会加，这里双保险）
    charset utf-8;
    charset_types text/html text/css application/javascript text/javascript application/json;
}
