<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141518" />
    <title>PhotoPicker 在线选片</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="home-page">
    <main class="home">
      <h1>PhotoPicker <span class="dim" data-en="Online">在线选片</span></h1>

      <form class="card" id="join">
        <h2 data-en="I'm picking">我来选片</h2>
        <input id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" class="code-input"
          placeholder="共享码" data-en-ph="Share code" required />
        <button class="btn primary big" type="submit" data-en="Open">进入</button>
      </form>

      <form class="card" id="create">
        <h2 data-en="I'm the photographer">我是摄影师</h2>
        <label>
          <span data-en="Album name">相册名</span>
          <input id="name" maxlength="40" placeholder="比如：小林 10.20 外景" data-en-ph="e.g. Lin, outdoor 10/20" required />
        </label>
        <label>
          <span data-en="Max picks (optional)">最多选几张（可不填）</span>
          <input id="limit" type="number" min="0" inputmode="numeric" placeholder="不限" data-en-ph="No limit" />
        </label>
        <label id="pw-row" hidden>
          <span data-en="Create password">创建密码</span>
          <input id="pw" type="password" autocomplete="current-password" />
        </label>
        <button class="btn primary big" type="submit" data-en="Create album">创建相册</button>
      </form>

      <section class="card" id="mine" hidden>
        <h2 data-en="My albums (this device)">我的相册（本机）</h2>
        <ul id="mine-list" class="mine"></ul>
      </section>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
